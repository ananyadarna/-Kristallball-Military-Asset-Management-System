version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: military_postgres
    restart: always
    environment:
      POSTGRES_DB: military_assets
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
